name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ vars.SITE_URL || 'https://lijuntong.github.io' }}
      BASE_PATH: ${{ vars.BASE_PATH || '/JtProductsIndex' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build

      - name: README 项目清单
        run: npm run readme -- --check

      - name: Check internal links
        run: npm run check:links

      # Pages 用「Deploy from a branch」指向 gh-pages，每次把 dist 强推上去即可。
      # public/.nojekyll 已随构建进入 dist，避免 _astro 目录被 Jekyll 过滤。
      - name: Publish to gh-pages
        run: |
          cd dist
          git init --initial-branch=gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: ${{ github.sha }}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
